[project.extra]
homepage = "/docs"

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/gptnt/"

[project.extra.tags]
Configuration = "configuration"
CLI = "cli"
"Model integration" = "model-integration"
"Extension API" = "extension-api"
Runtime = "runtime"
Results = "results"
Submission = "submission"
"Maintainer reference" = "maintainer-reference"

# Render ```mermaid fences client-side with beautiful-mermaid, loaded as an ESM
# module from esm.run. See docs/javascripts/beautiful-mermaid.js.
[[project.extra_javascript]]
path = "javascripts/beautiful-mermaid.js"
type = "module"

# ----------------------------------------------------------------------------
# In this section you can configure the Markdown extensions that are used when
# rendering your documentation. We enable the most useful extensions by default,
# but you can customize this list to your needs.
#
# Read more:
# - https://zensical.org/docs/setup/extensions/
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.magiclink]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]
base_path = ["docs", "."]

[project.markdown_extensions.pymdownx.superfences]
# A ```mermaid fence emits <pre class="beautiful-mermaid">. The distinct class
# keeps the theme's own mermaid renderer (which claims .mermaid) off these
# blocks, so beautiful-mermaid renders them instead. See
# docs/javascripts/beautiful-mermaid.js.
custom_fences = [
    {name = "mermaid", class = "beautiful-mermaid", format = "pymdownx.superfences.fence_code_format"},
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.toc]
permalink = true

# Zensical provides the GLightbox assets and wraps eligible documentation
# images. Add `off-glb` to an image that should not open in the lightbox.
[project.plugins.glightbox]
auto = true

# ----------------------------------------------------------------------------
# The mkdocstrings handler renders API reference from the package's docstrings.
# "paths" is resolved relative to the project root, so the docs build must run
# where "src/" is present. Reference an object in a page with, e.g.,
# ::: gptnt.specification.PlayerCapabilities
#
# Read more: https://zensical.org/docs/setup/extensions/mkdocstrings/
# ----------------------------------------------------------------------------
[project.plugins.mkdocstrings]
custom_templates = "docs/_templates"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv", "https://docs.pydantic.dev/latest/objects.inv", "https://pydantic.dev/docs/ai/objects.inv", "https://logfire.pydantic.dev/docs/objects.inv", "https://fastapi.tiangolo.com/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "spacy"
docstring_options = {ignore_init_summary = true}
extensions = [{griffe_pydantic = {schema = true}}]
members_order = "source"
group_by_category = true
show_category_heading = true
unwrap_annotated = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = false
show_root_heading = true
show_root_full_path = false
show_signature = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
backlinks = "tree"
show_if_no_docstring = true
inherited_members = false
filters = ["!^_", "!^model_config$"]
show_inheritance_diagram = false
parameter_headings = true
modernize_annotations = true

# ----------------------------------------------------------------------------
# Section for configuring theme options
# ----------------------------------------------------------------------------
[project.theme]
# Zensical supports more than 60 different languages. This means that the
# labels and tooltips that Zensical's templates produce are translated.
# The "language" option allows you to set the language used. This language
# is also indicated in the HTML head element to help with accessibility
# and guide search engines and translation tools.
#
# The default language is "en" (English). It is possible to create
# sites with multiple languages and configure a language selector. See
# the documentation for details.
#
# Read more:
# - https://zensical.org/docs/setup/language/
#
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.icon.tag]
configuration = "lucide/settings"
cli = "lucide/terminal"
model-integration = "lucide/cpu"
extension-api = "lucide/blocks"
runtime = "lucide/activity"
results = "lucide/database"
submission = "lucide/package-check"
maintainer-reference = "lucide/wrench"

# ----------------------------------------------------------------------------
# In the "palette" subsection you can configure options for the color scheme.
# You can configure different color schemes, e.g., to turn on dark mode,
# that the user can switch between. Each color scheme can be further
# customized.
#
# Read more:
# - https://zensical.org/docs/setup/colors/
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
