# @package player

defaults:
  - _self_

identity:
  display_name: GPT-5.6 Terra
  organisation: OpenAI
  is_os_model: false
  url: https://developers.openai.com/api/docs/models/gpt-5.6-terra

capabilities:
  player_name: gpt-5-6-terra
  tokens_per_image: 362
  structured_output_mode: native
  thinking_method: inner-monologue
  include_schema_in_instructions: false
  interaction_location_method: set-of-marks
  usage_limits:
    input_tokens_limit: 922000
    output_tokens_limit: 128000

action_predictor:
  agent:
    model:
      _target_: pydantic_ai.models.openai.OpenAIResponsesModel
      model_name: gpt-5.6-terra

    # Request a reasoning summary so the Responses model emits ThinkingParts for
    # the inner-monologue parser. Clear the base temperature to use the API default.
    model_settings:
      openai_reasoning_effort: medium
      openai_reasoning_summary: auto
      temperature: null
