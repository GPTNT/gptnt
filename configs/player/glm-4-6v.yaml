# @package player

identity:
  display_name: GLM-4.6V (106B)
  organisation: Z.ai
  is_os_model: true
  url: https://huggingface.co/zai-org/GLM-4.6V

capabilities:
  player_name: glm-4-6v
  # 640x480 is resized to a 23x17 grid of merged visual patches, plus boundary tokens.
  # Calibrate this against the deployed endpoint with `gptnt measure-tokens-per-image`.
  tokens_per_image: 393
  structured_output_mode: native
  thinking_method: inner-monologue
  include_schema_in_instructions: false
  interaction_location_method: set-of-marks
  coordinate_mode: normalised
  coordinate_scale: 1000
  usage_limits:
    input_tokens_limit: 126071
    output_tokens_limit: 5001

action_predictor:
  agent:
    model:
      _target_: pydantic_ai.models.openai.OpenAIChatModel
      model_name: glm-4-6v

    model_settings:
      _target_: pydantic_ai.models.openai.OpenAIChatModelSettings
      _convert_: all
      max_tokens: 5000
      temperature: 0.8
      top_p: 0.6
      extra_body:
        top_k: 2
        repetition_penalty: 1.1
        chat_template_kwargs:
          enable_thinking: ${gptnt.eq:${player.capabilities.thinking_method},inner-monologue}
