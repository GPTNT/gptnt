# @package player

identity:
  display_name: ERNIE 4.5 VL (28B-A3B)
  organisation: Baidu
  is_os_model: true
  url: https://huggingface.co/baidu/ERNIE-4.5-VL-28B-A3B-PT

capabilities:
  player_name: ernie-4-5-vl
  # Provisional estimate; calibrate against the deployed endpoint before long runs.
  tokens_per_image: 302
  structured_output_mode: native
  thinking_method: inner-monologue
  include_schema_in_instructions: false
  interaction_location_method: set-of-marks
  coordinate_mode: normalised
  coordinate_scale: 1000
  usage_limits:
    # The model context is 131,072 tokens; reserve 5,001 tokens for output.
    input_tokens_limit: 126071
    output_tokens_limit: 5001

action_predictor:
  agent:
    model:
      _target_: pydantic_ai.models.openai.OpenAIChatModel
      model_name: ernie-4-5-vl
    model_settings:
      _target_: pydantic_ai.models.openai.OpenAIChatModelSettings
      _convert_: all
      max_tokens: 5000
      # Values shipped in Baidu's generation_config.json. No top-k is specified.
      temperature: 0.2
      top_p: 0.8
      extra_body:
        chat_template_kwargs:
          enable_thinking: ${gptnt.eq:${player.capabilities.thinking_method},inner-monologue}
