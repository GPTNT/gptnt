name: CI

on:
  workflow_call:
    inputs:
      run_tests:
        description: Run pytest even when the caller event has no usable path diff.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - "v*"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    name: Check for file changes
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && !github.event.pull_request.draft }}
    permissions:
      pull-requests: read
      contents: read
    outputs:
      tests: ${{steps.filter.outputs.tests}}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Full history so paths-filter can diff against the push `before` SHA
          # locally instead of an authenticated fetch (which fails under
          # persist-credentials: false on push-to-main).
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            deps: &deps-files
              - 'pyproject.toml'
              - 'uv.lock'
            ci: &ci-files
              - '.github/workflows/**'
            tests:
              - *deps-files
              - *ci-files
              - '**/*.py'
              # A release bump changes this file. Exercise pytest on the release commit as well
              # as in the tag-triggered release workflow.
              - 'CHANGELOG.md'
              # This defines the local release command, so its changes need the same gate.
              - 'mise.toml'
              # Benchmark configuration and manifests can change the generated workload without
              # changing Python, so they need the same test gate.
              - 'configs/**'
              - 'runs/**'
              - 'storage/**'

  check_pre_commit:
    name: Check pre-commit
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached prek environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: prek-cache
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prek-

      - name: Install deps
        run: uv sync --all-groups --all-extras

      - name: Run prek hook
        id: run-prek-hooks
        run: |
          git add .pre-commit-config.yaml
          uv run prek run --color=always --all-files

      - name: Annotate any changes using reviewdog
        if: ${{ failure() }}
        id: reviewdog-suggester
        uses: reviewdog/action-suggester@2558ba17e65a9039e73764a73009fc05fef28a46 # v1.24.3
        with:
          tool_name: prek

      - name: Save prek cache
        if: ${{ always() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('**/.pre-commit-config.yaml') }}

  test:
    name: Run pytest
    needs: [changes]
    # A manual or reusable CI invocation is an explicit request to test. Pushes and pull requests
    # remain path-filtered to avoid consuming a full test run for unrelated documentation changes.
    if: >-
      ${{
        always()
        && !github.event.pull_request.draft
        && (
          inputs.run_tests
          || github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.tests == 'true'
        )
      }}
    uses: ./.github/workflows/verify.yaml

    permissions:
      contents: read
      checks: write
      pull-requests: write
